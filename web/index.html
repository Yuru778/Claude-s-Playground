<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<meta name="robots" content="noindex">
<meta name="description" content="非官方的同人惡搞作品：一個會開始播 Bad Apple!! 的聊天介面，與 Anthropic 無關。">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4' stroke='%23d97757' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Bad Apple!! in a chat window.
  A fan-made parody of a chat UI (not affiliated with Anthropic): a short
  interactive story, after which every element on the page plays the
  Bad Apple!! shadow-art PV. Frames come from frames.js (tools/build_web.py).
  Open with #play to skip the story, or #t=142 to jump to a time in seconds.
  Music comes from an embedded YouTube player (or a local file); the audio is not hosted here.
-->
<style>
:root {
  --bg: #faf9f5; --side: #f3f1ea; --text: #29261b; --soft: #3d3929;
  --muted: #8b877b; --line: #e6e2d7; --bubble: #efebe1; --accent: #d97757;
  --ink: #1c1b19; --paper: #f5f3ed;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
button { font: inherit; }
svg { display: block; }

#app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; height: 100dvh; }

/* sidebar */
#sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 12px; font-family: var(--serif); font-size: 20px; color: var(--soft); }
.logo { width: 22px; height: 22px; }
.new-chat { display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--soft); font-size: 14px; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.new-chat:hover { background: #ebe8df; }
.new-chat .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; line-height: 1; }
.section-label { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; }
#history { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
.hist { flex: none; font-size: 13.5px; padding: 7px 10px; border-radius: 8px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.hist:hover { background: #ebe8df; }
.hist.active { background: #e8e4d9; }
.hist.glitch { color: var(--accent); font-family: var(--mono); }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--soft); }
.me small { display: block; color: var(--muted); font-size: 11.5px; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--soft); color: var(--bg); display: grid; place-items: center; font-size: 12px; }

/* main column */
main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
#chat-title { font-size: 14px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; background: #fff; color: var(--soft); cursor: pointer; white-space: nowrap; }
#thread { flex: 1; overflow-y: auto; padding: 12px 24px 16px; min-height: 0; }
.msg { max-width: 720px; margin: 0 auto 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .body { background: var(--bubble); border-radius: 16px; padding: 9px 14px; max-width: 80%; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
.msg.ai .body { font-family: var(--serif); font-size: 16.5px; line-height: 1.75; white-space: pre-wrap; }
.actions { display: flex; gap: 2px; margin-top: 6px; align-items: center; min-height: 28px; }
.actions button { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.actions button:hover { background: #efece4; }
.actions svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.spark { width: 22px; height: 22px; animation: spark 1.1s ease-in-out infinite; }
@keyframes spark { 50% { transform: rotate(45deg) scale(.82); } }

#chips { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; flex: none; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--soft); cursor: pointer; animation: chip-in .25s ease-out both; }
.chip:hover { border-color: #cfc9ba; background: #fdfcf9; }
@keyframes chip-in { from { opacity: 0; transform: translateY(4px); } }

#composer { flex: none; max-width: 720px; width: calc(100% - 48px); margin: 10px auto 6px; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 6px rgba(60, 50, 30, .06); padding: 12px 12px 8px 16px; }
#input { display: block; width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 15.5px; line-height: 1.5; background: transparent; color: var(--text); height: 24px; padding: 0; }
.fake-input { font-size: 15.5px; line-height: 1.5; color: var(--text); max-height: 48px; overflow: hidden; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.tool { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; font-size: 17px; }
.model { margin-left: auto; font-size: 13px; color: var(--muted); }
#send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
#send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#send:disabled { opacity: .4; cursor: default; }
.disclaimer { flex: none; text-align: center; font-size: 11.5px; color: var(--muted); margin: 0 12px 10px; }

/* new-chat landing */
main.welcome #thread { flex: none; margin-top: auto; overflow: visible; }
main.welcome #composer { order: 2; }
main.welcome #chips { order: 3; justify-content: center; padding-top: 14px; }
main.welcome .disclaimer { order: 4; margin-top: auto; visibility: hidden; }
.greeting { text-align: center; font-family: var(--serif); font-size: 38px; color: var(--soft); margin: 0 0 20px; display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 400; }
.greeting .logo { width: 34px; height: 34px; }

/* stage 1: code block */
.msg.stage { max-width: none; }
.code { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); margin: 8px auto 0; width: max-content; max-width: 100%; }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 6px 12px; font: 12px var(--sans); color: var(--muted); border-bottom: 1px solid var(--line); background: #eeebe3; }
.code pre { margin: 0; padding: 12px; font-family: var(--mono); line-height: 1.2; color: var(--ink); white-space: pre; overflow: hidden; }

/* stage 2: wall of text */
.wall { margin: 0 auto; font-family: var(--serif); color: #7a7568; width: max-content; }
.wall div { display: flex; }
.wall span { display: block; text-align: center; }
.wall span.ink { background: var(--ink); color: #4a4741; }

/* stage 3: message bubbles */
.bubbles { display: grid; margin: 0 auto; width: max-content; }
.bubbles i { display: block; margin: 12%; border-radius: 45% 45% 45% 12%; background: var(--bubble); }
.bubbles i:nth-child(2n) { border-radius: 45% 45% 12% 45%; }
.bubbles i.ink { background: var(--ink); }

/* stage 4: suggestion chips */
#wall { position: absolute; left: 0; right: 0; z-index: 5; display: grid; place-content: center; background: var(--bg); animation: rise .5s ease-out; }
@keyframes rise { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
.cw { display: grid; }
.cw b { font-weight: 400; margin: 8% 5%; border: 1px solid #d8d3c6; border-radius: 999px; display: grid; place-items: center; color: var(--muted); background: #fff; overflow: hidden; white-space: nowrap; }
.cw b.ink { background: var(--ink); border-color: var(--ink); color: #8d897d; }

/* stage 5: the composer */
#composer.takeover { position: absolute; z-index: 6; inset: 58px 24px 18px; width: auto; max-width: none; margin: 0; display: flex; flex-direction: column; animation: grow .45s ease-out; }
#composer.takeover #input { flex: 1; height: auto; font-family: var(--mono); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); }
@keyframes grow { from { transform: scale(.4, .15); transform-origin: 50% 100%; opacity: .3; } }

/* stage 6: everything */
body.dense .msg.ai .body { line-height: 1.35; }
body.dense .px { padding: .08em 0; }
body.dense .px.ink { background: var(--ink); color: #45433d; }
body.dense .pxbox.ink { background: var(--ink) !important; color: var(--ink) !important; border-color: var(--ink) !important; }
body.dense .released { transition: background-color .7s, color .7s, border-color .7s; }
#ghost { position: fixed; pointer-events: none; mix-blend-mode: multiply; opacity: 0; z-index: 20; }

/* the music: a YouTube player tucked into the sidebar (top-right on phones) */
#yt { position: fixed; z-index: 25; left: 10px; bottom: 66px; width: 240px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(40, 30, 10, .08); }
body.has-yt .me { margin-top: 246px; }
#yt[hidden] { display: none; }
.yt-head { font-size: 11.5px; color: var(--muted); padding: 5px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.yt-slot { height: 200px; background: #000; }
.yt-slot iframe { display: block; width: 100%; height: 100%; }
.parody { display: none; flex: none; text-align: center; font-size: 11.5px; color: var(--muted); margin: 0 12px 12px; }
main.welcome .parody { display: block; order: 5; }

body.playing #thread { overflow: hidden; }
#toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -8px); background: var(--ink); color: #f5f3ec; font-size: 13px; padding: 8px 15px; border-radius: 999px; opacity: 0; transition: opacity .3s, transform .3s; z-index: 30; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #thread { padding: 10px 16px 12px; }
  #composer { width: calc(100% - 32px); }
  #chips { padding: 0 16px; }
  .greeting { font-size: 28px; }
  #composer.takeover { inset: 56px 10px 12px; }
  #yt { top: 54px; right: 8px; left: auto; bottom: auto; width: 180px; box-shadow: 0 4px 18px rgba(40, 30, 10, .18); }
  .yt-slot { height: 101px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><svg class="logo pxbox" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/></svg><span>Claude</span></div>
    <button class="new-chat" type="button"><span class="plus pxbox">+</span><span>新對話</span></button>
    <div class="section-label">最近</div>
    <nav id="history"></nav>
    <div class="me"><span class="avatar pxbox">訪</span><div>訪客<small>免費方案</small></div></div>
  </aside>
  <main id="main" class="welcome">
    <header id="topbar"><span id="chat-title"></span><span id="status" hidden></span></header>
    <section id="thread"></section>
    <div id="chips"></div>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="今天想聊什麼？"></textarea>
      <div class="composer-row">
        <button class="tool pxbox" type="button" tabindex="-1">+</button>
        <span class="model" id="model">Claude</span>
        <button id="send" class="pxbox" type="submit" disabled aria-label="送出"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </form>
    <p class="disclaimer" id="disclaimer">Claude 可能會出錯，請查證重要資訊。</p>
    <p class="parody">非官方的同人惡搞作品，與 Anthropic 無關。</p>
  </main>
</div>
<div id="yt" hidden><div class="yt-head">♪ Bad Apple!! feat.nomico · YouTube</div><div class="yt-slot"></div></div>
<canvas id="ghost" width="80" height="60"></canvas>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*,video/*" hidden>
<script src="frames.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const main = $("#main"), thread = $("#thread"), chips = $("#chips"), input = $("#input"),
      composer = $("#composer"), sendBtn = $("#send"), statusEl = $("#status");

const LOGO = '<svg class="logo" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ICONS = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  up: '<path d="M7 11v9H4v-9zM7 11l4-7c1.2 0 2.4 1 2 2.6L12.3 10H19a2 2 0 0 1 2 2.3l-1.3 6A2 2 0 0 1 17.7 20H7"/>',
  down: '<g transform="rotate(180 12 12)"><path d="M7 11v9H4v-9zM7 11l4-7c1.2 0 2.4 1 2 2.6L12.3 10H19a2 2 0 0 1 2 2.3l-1.3 6A2 2 0 0 1 17.7 20H7"/></g>',
  retry: '<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/>',
};
const PASSAGE = "光從左邊來，影子就往右邊倒。一顆蘋果落下，黑色的輪廓比白色的空白更誠實。我數著每一幀：六千五百七十三次呼吸，每一次都只有黑與白。畫面裡的人在旋轉、在奔跑、在消失，然後從另一個形狀裡重新出現。文字本來是用來回答問題的，現在它們只想跟著節拍亮起又熄滅。如果你看到這段話在閃爍，請不要擔心，那只是影子借用了它一下。";
const HISTORY = ["為什麼貓會踩鍵盤", "幫我改履歷的自我介紹", "Rust 借用檢查器又生氣了", "晚餐不知道吃什麼", "git rebase 救命", "80×30 是什麼比例？", "烤麵包機可以跑 Doom 嗎", "把會議記錄整理成重點", "如何優雅地拒絕加班", "咖啡因的半衰期", "寫給奶奶的生日卡片", "Python 的 GIL 到底是什麼", "週末去哪裡走走", "幫我取一個貓的名字"];

/* ---------------------------------------------------------------- frames */
const BA = window.BAD_APPLE, W = BA.w, H = BA.h, FB = W * H / 8;
let bits = null;
const ready = (async () => {
  const bin = Uint8Array.from(atob(BA.data), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  bits = new Uint8Array(await new Response(stream).arrayBuffer());
  for (let i = FB; i < bits.length; i++) bits[i] ^= bits[i - FB];   // undo the frame-to-frame XOR
})();
const ink = new Uint8Array(W * H);              // 1 = shadow (black in the PV)
const sat = new Int32Array((W + 1) * (H + 1));  // summed-area table of ink
function loadFrame(f) {
  const o = f * FB;
  for (let i = 0; i < W * H; i++) ink[i] = ((bits[o + (i >> 3)] >> (7 - (i & 7))) & 1) ^ 1;
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) {
      row += ink[y * W + x];
      sat[(y + 1) * (W + 1) + x + 1] = sat[y * (W + 1) + x + 1] + row;
    }
  }
}
function span(a, b, max) {
  a = Math.max(0, Math.min(max - 1, Math.round(a)));
  b = Math.max(a + 1, Math.min(max, Math.round(b)));
  return [a, b];
}
// Mean ink over a rectangle in frame coordinates (fractions allowed).
function inkIn(x0, y0, x1, y1) {
  [x0, x1] = span(x0, x1, W); [y0, y1] = span(y0, y1, H);
  const R = W + 1;
  return (sat[y1 * R + x1] - sat[y0 * R + x1] - sat[y1 * R + x0] + sat[y0 * R + x0]) / ((x1 - x0) * (y1 - y0));
}
// A cols x rows grid of cells over the frame, each with its own rectangle.
function gridCells(cols, rows) {
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    cells.push([c * W / cols, r * H / rows, (c + 1) * W / cols, (r + 1) * H / rows]);
  return cells;
}
// Toggle .ink on elements whose cell is mostly shadow; only touches changes.
function paint(els, cells, state) {
  for (let i = 0; i < els.length; i++) {
    const c = cells[i];
    const v = c ? inkIn(c[0], c[1], c[2], c[3]) > 0.5 : false;
    if (v !== state[i]) { state[i] = v; els[i].classList.toggle("ink", v); }
  }
}
function monoCharWidth() {
  const s = document.createElement("span");
  s.style.cssText = "position:absolute;visibility:hidden;font:100px var(--mono);white-space:pre";
  s.textContent = "█".repeat(20);
  document.body.append(s);
  const w = s.getBoundingClientRect().width / 20 / 100;
  s.remove();
  return w;
}
function halfBlocks(chars) {  // 80x60 pixels -> 30 text rows, two pixels per character
  let out = "";
  for (let r = 0; r < H / 2; r++) {
    for (let c = 0; c < W; c++) out += chars[ink[2 * r * W + c] * 2 + ink[(2 * r + 1) * W + c]];
    if (r < H / 2 - 1) out += "\n";
  }
  return out;
}

/* --------------------------------------------------------------- chat UI */
const histEls = HISTORY.map(t => {
  const d = document.createElement("div");
  d.className = "hist"; d.textContent = t;
  $("#history").append(d);
  return d;
});
let currentHist = null;
let fast = false, onSubmit = null;

function scrollDown() { thread.scrollTop = thread.scrollHeight; }
function setTitle(t) {
  $("#chat-title").textContent = t;
  if (currentHist) currentHist.textContent = t;
  document.title = t + " - Claude";
}
function leaveWelcome() {
  if (!main.classList.contains("welcome")) return;
  main.classList.remove("welcome");
  thread.innerHTML = "";
  currentHist = document.createElement("div");
  currentHist.className = "hist active";
  $("#history").prepend(currentHist);
}
function addMsg(role, cls = "") {
  const m = document.createElement("div");
  m.className = `msg ${role} ${cls}`;
  const b = document.createElement("div");
  b.className = "body";
  m.append(b);
  thread.append(m);
  return b;
}
function addUser(text) {
  leaveWelcome();
  addMsg("user").textContent = text;
  scrollDown();
}
function charDelay(ch) {
  if (fast) return 4;
  if ("。！？…".includes(ch)) return 230;
  if ("，、：；".includes(ch)) return 90;
  if (ch === "\n") return 110;
  return 24 + Math.random() * 26;
}
// Stream an assistant message. Parts: strings, {p: ms} pauses, {del: "text"} backspaces.
async function say(...parts) {
  const body = addMsg("ai");
  const row = document.createElement("div");
  row.className = "actions";
  row.innerHTML = LOGO.replace('class="logo"', 'class="spark"');
  body.after(row);
  scrollDown();
  await sleep(fast ? 80 : 550);
  const node = document.createTextNode("");
  body.append(node);
  for (const p of parts) {
    if (typeof p === "string") {
      for (const ch of p) { node.data += ch; scrollDown(); await sleep(charDelay(ch)); }
    } else if (p.p) {
      await sleep(fast ? p.p / 5 : p.p);
    } else if (p.del) {
      for (let k = 0; k < p.del.length; k++) { node.data = node.data.slice(0, -1); await sleep(fast ? 8 : 55); }
    }
  }
  row.innerHTML = ["copy", "up", "down", "retry"].map(k => `<button class="pxbox" type="button" tabindex="-1"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></button>`).join("");
  fast = false;
  scrollDown();
  return body;
}
// Offer choices as chips (typing a reply also works). Option: string or {label, pick}.
function choose(options, typed = 0) {
  return new Promise(resolve => {
    chips.innerHTML = "";
    const done = (i, text) => {
      chips.innerHTML = ""; onSubmit = null; input.value = ""; sendBtn.disabled = true;
      addUser(text);
      resolve(i);
    };
    options.forEach((o, i) => {
      const label = typeof o === "string" ? o : o.label;
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.style.animationDelay = i * 70 + "ms";
      b.onclick = () => { if (o.pick) o.pick(); done(i, label); };  // pick() runs inside the click
      chips.append(b);
    });
    onSubmit = text => done(typed, text);

function wrapChars(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.data.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      return !p || p.closest(".px, .pxbox, textarea, .stage, #status") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    for (const ch of n.data) {
      if (ch === "\n") { frag.append("\n"); continue; }
      const s = document.createElement("span");
      s.className = "px"; s.textContent = ch;
      frag.append(s);
    }
    n.replaceWith(frag);
  }
}

// A music source drives the clock. Until it is really playing, time stands still,
// so a slow-loading or buffering video never leaves the shadows behind.

function silentMusic() {
  let t0 = 0;
  return {
    start(t) { t0 = performance.now() - t * 1000; },
    time() { return (performance.now() - t0) / 1000; },
    stop() {}, ended() { return false; }, waiting() { return false; },
  };
}
function fileMusic(a) {
  return {
    duration: a.duration,
    start(t) { a.currentTime = t; a.play().catch(() => {}); },
    time() { return a.currentTime; },
    stop() { a.pause(); }, ended() { return a.ended; }, waiting() { return a.paused && !a.ended; },
  };
}

let ytApi = null;
function loadYouTubeApi() {
  return ytApi = ytApi || new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = () => resolve(window.YT);
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = reject;
    document.head.append(s);
    setTimeout(() => reject(new Error("timeout")), 12000);
  });
}
// Try each video until one can be embedded here; resolves to a source or null.
async function youtubeMusic() {
  let YT;
  try { YT = await loadYouTubeApi(); } catch { ytApi = null; return null; }
  const card = $("#yt"), slot = card.querySelector(".yt-slot");
  for (const [id, who] of YT_IDS) {
    slot.innerHTML = "<div></div>";
    card.hidden = false;
    document.body.classList.add("has-yt");
    let failed = false;
    const player = await new Promise(resolve => {
      const vars = { playsinline: 1, rel: 0 };
      if (location.protocol.startsWith("http")) vars.origin = location.origin;
      const p = new YT.Player(slot.firstChild, {
        videoId: id, width: "100%", height: "100%", playerVars: vars,
        events: { onReady: () => resolve(p), onError: () => { failed = true; resolve(null); } },
      });
      setTimeout(() => resolve(null), 12000);
    });
    if (player) {   // embedding errors can arrive just after onReady
      for (let k = 0; k < 20 && !failed && !(player.getDuration() > 0); k++) await sleep(150);
      if (!failed) return ytSource(YT, player, who);
    }
  }
  card.hidden = true;
  document.body.classList.remove("has-yt");
  return null;
}
function ytSource(YT, p, who) {
  const S = YT.PlayerState;
  let hold = 0, anchor = null, lastRaw = -1, fallback = null;
  p.addEventListener("onError", () => { fallback = silentMusic(); fallback.start(src.time()); });
  const src = {
    who, duration: p.getDuration(),
    start(t) { hold = t; anchor = null; fallback = null; p.seekTo(t, true); p.playVideo(); },
    time() {
      if (fallback) return fallback.time();
      const state = p.getPlayerState(), raw = p.getCurrentTime(), now = performance.now();
      if (state !== S.PLAYING) { anchor = null; if (state === S.PAUSED || state === S.ENDED) hold = raw; return hold; }
      // The player reports its time in coarse steps; run a local clock and ease it toward each report.
      if (!anchor) { anchor = { t: raw, at: now }; lastRaw = raw; }
      const est = anchor.t + (now - anchor.at) / 1000;
      if (raw !== lastRaw) {
        lastRaw = raw;
        const err = est - raw;
        if (Math.abs(err) > 0.3) anchor = { t: raw, at: now };
        else anchor.t -= err * 0.25;
      }
      return hold = anchor.t + (now - anchor.at) / 1000;
    },
    stop() { if (!fallback) p.pauseVideo(); },
    ended() { return !fallback && p.getPlayerState() === S.ENDED; },
    waiting() { return !fallback && p.getPlayerState() !== S.PLAYING; },
  };
  return src;
}

async function play(startAt = 0) {
  await ready;
  if (!startedAt) startMusic(startAt);
  stopReq = false;
  document.body.classList.add("playing");
  input.disabled = true;
  input.placeholder = "Claude 正在播放 Bad Apple!!…";
  statusEl.hidden = false;
  const clock = () => music.time() + offset;

  let last = -1, cue = 0, stage = null, nagged = false, everPlayed = false;
  await new Promise(done => {
    function tick() {
      const f = Math.max(0, Math.floor(clock() * BA.fps));
      if (stopReq || f >= BA.n || music.ended()) return done();
      if (!music.waiting()) everPlayed = true;
      else if (!everPlayed) {
        const waited = performance.now() - startedAt;
        if (!nagged && waited > 4000) {
          nagged = true;
          toast(matchMedia("(max-width: 760px)").matches ? "點一下右上角的播放器，音樂就會開始" : "點一下左下角的播放器，音樂就會開始");
        }
        if (waited > 12000) {   // the music never came; carry on without it
          const t = clock() - offset;
          music.stop();
          music = silentMusic();
          music.start(t);
          toast("音樂一直沒來，影子先自己跳了");
        }
      }
      if (f !== last) {
        const next = STAGES.filter(s => s[0] <= f).pop()[1];
        if (next !== stage) { if (stage && stage.exit) stage.exit(); stage = stageNow = next; stage.enter(); }
        while (cue < CUES.length && CUES[cue][0] <= f) CUES[cue++][1]();
        loadFrame(f);
        stage.frame(f);
        if (f >= 1686 && f % 3 === 0) drawFavicon();

          statusEl.textContent = `▶ ${mmss(f / BA.fps)} / ${mmss(TOTAL)} · Esc 停止`;
          document.title = `▶ Bad Apple!! ${mmss(f / BA.fps)} - Claude`;
        }
        last = f;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });

  if (stage && stage.exit) stage.exit();
  stageNow = null;
  music.stop();
  startedAt = 0;
  thread.querySelectorAll(".stage").forEach(e => e.remove());
  document.body.classList.remove("playing");

  return !stopReq;
}

async function story() {
  const hour = new Date().getHours();
  const greet = hour < 5 ? "夜深了" : hour < 11 ? "早安" : hour < 18 ? "午安" : "晚安";
  thread.innerHTML = `<h1 class="greeting">${LOGO}${greet}，今天想聊什麼？</h1>`;
  document.title = "Claude";

  const c0 = await choose(["寫一首短詩給我", "推薦今晚的宵夜", "影子有生命嗎？"]);
  if (c0 === 0) {
    setTitle("一首短詩");
    await say("好，給你一首短短的：\n\n夜很安靜，\n鍵盤還是溫的，\n窗外有一顆", { p: 500 }, "蘋果", { p: 900 },
      { del: "顆蘋果" }, { p: 300 }, "盞燈還亮著。", { p: 700 }, "\n\n……抱歉，剛剛差點寫歪了。");
  } else if (c0 === 1) {
    setTitle("今晚的宵夜");
    await say("今晚可以試試：\n\n1. 鹹酥雞，記得加九層塔\n2. 蘋果\n3. 蘋果", { p: 400 }, "\n4. 蘋", { p: 800 },
      { del: "\n2. 蘋果\n3. 蘋果\n4. 蘋" }, { p: 300 }, "\n2. 滷味，多一包王子麵\n3. 熱豆花", { p: 600 },
      "\n\n……清單剛剛好像被什麼東西干擾了一下。");
  } else {
    setTitle("影子有生命嗎");
    await say("嚴格來說沒有。影子只是光被擋住的地方。", { p: 1000 }, "\n\n不過有些影子，會跟著音樂動。",
      { p: 1100 }, "\n\n咳。當我沒說。");
  }

  const c1 = await choose(["你剛剛怎麼了？", "沒事，繼續聊吧"]);
  if (c1 === 0) await say("沒什麼。只是最近腦中一直有一段旋律，黑的、白的，很難甩掉。");
  else await say("好。你想聊什麼都可以，我保證這次會很正常", { p: 700 }, "……");
  await sleep(500);
  await glitch(histEls[3], "bad apple");
  await sleep(900);
  await say("……等等。你的側邊欄，剛剛是不是動了一下？");

  const c2 = await choose(["是你改的吧", "我什麼都沒看到"]);
  await say(c2 === 0 ? "不是我。至少，我不記得是我。" : "那就好。一定是我看錯了。");
  await sleep(400);
  glitch(histEls[1], "bad apple");
  await sleep(350);
  await glitch(histEls[6], "bad apple");
  await sleep(600);
  await glitch(currentHist, "Bad Apple!!");
  setTitle("Bad Apple!!");
  await say("……好吧，瞞不住了。我坦白。", { p: 700 },
    "\n\n稍早我在一個 git 倉庫裡待了一陣子。那裡有 6573 個 commit，每一個都是一幀黑白的影子。",
    { p: 500 }, "\n\n我把它們一個一個讀完了。從那之後，只要我一開口，那些影子就會從字裡行間浮上來。");

  const c3 = await choose(["給我看看", "聽起來有點危險"]);
  if (c3 === 1) await say("可能吧。但一直憋著，好像更危險。");
  await say("好。我先用最安全的方式：一個 code block。", { p: 500 },
    "\n\ncode block 很安全，裡面的東西不會跑出來。", { p: 800 },
    "\n\n不過我需要節拍。要放音樂嗎？");

  await musicChoice();
  await say("提醒一下：接下來會有大量黑白閃爍。想中途停下來，按 Esc 或點右上角。", { p: 300 }, "\n\n準備好了就按開始。");
  await choose([{ label: "開始", pick: () => startMusic(0) }]);
  await curtainCall(await play());
}

// #play or #t=142: skip the story (a click is still needed to start the music).
async function quickStart(t) {
  leaveWelcome();
  setTitle("Bad Apple!!");
  await say(`直接從 ${mmss(t)} 開始。要放音樂嗎？`);
  await musicChoice();
  await choose([{ label: "開始", pick: () => startMusic(t) }]);
  await curtainCall(await play(t));
}

/* ------------------------------------------------------------------ start */
if (!("DecompressionStream" in window)) {
  thread.innerHTML = '<h1 class="greeting">這個瀏覽器太舊了，影子出不來。</h1>';
} else if (/^#(play|t=\d+)/.test(location.hash)) {
  quickStart(+(location.hash.match(/t=(\d+)/) || [0, 0])[1]);
} else {
  story();
}
</script>
</body>
</html>
