<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<meta name="robots" content="noindex">
<meta name="description" content="An unofficial fan-made parody of a chat app. Not affiliated with Anthropic.">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4' stroke='%23d97757' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Bad Apple!! in a chat window.
  A fan-made parody of a chat UI (not affiliated with Anthropic). Chat for
  a bit (after a language prompt, or ?lang=xx), and then every element plays the
  Bad Apple!! shadow-art PV; the second half switches to dark mode and
  tears the layout apart. Frames come from frames.js (tools/build_web.py),
  strings from i18n.js. Music comes from an embedded YouTube player that
  stays out of sight until the show starts; no audio is hosted here.
  ?lang=ja skips the language prompt; #play skips the story; #t=142 jumps
  to a time in seconds.
-->
<style>
:root {
  --bg: #faf9f5; --side: #f3f1ea; --text: #29261b; --soft: #3d3929;
  --muted: #8b877b; --line: #e6e2d7; --bubble: #efebe1; --accent: #d97757;
  --ink: #1c1b19; --paper: #f5f3ed; --card: #fff; --hover: #ebe8df; --active: #e8e4d9;
  --lit: #f4f1e8; --lit-text: #bdb8ab;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --serif: "Noto Serif", "Noto Serif TC", "Source Han Serif TC", "Songti TC", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
html:lang(zh-Hans) { --sans: ui-sans-serif, system-ui, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --serif: "Noto Serif SC", "Songti SC", "SimSun", serif; }
html:lang(ja) { --sans: ui-sans-serif, system-ui, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; }
html:lang(ko) { --sans: ui-sans-serif, system-ui, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif; }
html:lang(ar) { --serif: "Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif; }
html:lang(hi) { --serif: "Noto Serif Devanagari", "Kohinoor Devanagari", "Nirmala UI", serif; }
html:lang(th) { --serif: "Noto Serif Thai", "Thonburi", "Leelawadee UI", serif; }
body.dark {
  --bg: #262624; --side: #1f1e1d; --text: #ece9e1; --soft: #d6d2c7; --muted: #8f8b80;
  --line: #3b3a36; --bubble: #34332f; --paper: #2d2c29; --card: #30302e; --hover: #34332f; --active: #3a3935;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; transition: background-color .25s; }
button { font: inherit; }
svg { display: block; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; height: 100dvh; }

/* sidebar */
#sidebar { background: var(--side); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; min-height: 0; transition: background-color .25s; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 12px; font-family: Georgia, serif; font-size: 20px; color: var(--soft); }
.logo { width: 22px; height: 22px; }
.new-chat { display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--soft); font-size: 14px; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: start; }
.new-chat:hover { background: var(--hover); }
.new-chat .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; line-height: 1; }
.section-label { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; }
#history { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
.hist { flex: none; font-size: 13.5px; padding: 7px 10px; border-radius: 8px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.hist:hover { background: var(--hover); }
.hist.active { background: var(--active); }
.hist.glitch { color: var(--accent); font-family: var(--mono); }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--soft); }
.me small { display: block; color: var(--muted); font-size: 11.5px; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--soft); color: var(--bg); display: grid; place-items: center; font-size: 12px; }

/* main column */
main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
#chat-title { font-size: 14px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; background: var(--card); color: var(--soft); cursor: pointer; white-space: nowrap; direction: ltr; }
#thread { flex: 1; overflow-y: auto; padding: 12px 24px 16px; min-height: 0; }
.msg { max-width: 720px; margin: 0 auto 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .body { background: var(--bubble); border-radius: 16px; padding: 9px 14px; max-width: 80%; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
.msg.ai .body { font-family: var(--serif); font-size: 16.5px; line-height: 1.75; white-space: pre-wrap; }
.actions { display: flex; gap: 2px; margin-top: 6px; align-items: center; min-height: 28px; }
.actions button { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.actions button:hover { background: var(--hover); }
.actions svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.spark { width: 22px; height: 22px; animation: spark 1.1s ease-in-out infinite; }
@keyframes spark { 50% { transform: rotate(45deg) scale(.82); } }

#chips { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; flex: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--soft); cursor: pointer; animation: chip-in .25s ease-out both; }
.chip:hover { border-color: var(--muted); }
@keyframes chip-in { from { opacity: 0; transform: translateY(4px); } }

#composer { flex: none; max-width: 720px; width: calc(100% - 48px); margin: 10px auto 6px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 6px rgba(60, 50, 30, .06); padding: 12px 12px 8px 16px; }
#input { display: block; width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 15.5px; line-height: 1.5; background: transparent; color: var(--text); height: 24px; padding: 0; }
.fake-input { font-size: 15.5px; line-height: 1.5; color: var(--text); max-height: 48px; overflow: hidden; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.tool { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; font-size: 17px; }
.model { margin-inline-start: auto; font-size: 13px; color: var(--muted); }
#send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
#send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#send:disabled { opacity: .4; cursor: default; }
.disclaimer { flex: none; text-align: center; font-size: 11.5px; color: var(--muted); margin: 0 12px 10px; }
.parody { display: none; flex: none; text-align: center; font-size: 11.5px; color: var(--muted); margin: 0 12px 12px; }

/* new-chat landing */
main.welcome #thread { flex: none; margin-top: auto; overflow: visible; }
main.welcome #composer { order: 2; }
main.welcome #chips { order: 3; justify-content: center; padding-top: 14px; }
main.welcome .disclaimer { order: 4; margin-top: auto; visibility: hidden; }
main.welcome .parody { display: block; order: 5; }
.greeting { text-align: center; font-family: var(--serif); font-size: 38px; color: var(--soft); margin: 0 0 20px; display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 400; }
.greeting .logo { width: 34px; height: 34px; flex: none; }

/* stage 1: code block */
.msg.stage { max-width: none; direction: ltr; }
.code { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); margin: 8px auto 0; width: max-content; max-width: 100%; }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 6px 12px; font: 12px var(--sans); color: var(--muted); border-bottom: 1px solid var(--line); background: var(--hover); }
.code pre { margin: 0; padding: 12px; font-family: var(--mono); color: var(--ink); white-space: pre; overflow: hidden; }

/* stage 2: wall of text */
.wall { margin: 0 auto; font-family: var(--serif); color: #7a7568; width: max-content; }
.wall div { display: flex; }
.wall span { display: block; text-align: center; overflow: hidden; }
.wall span.on { background: var(--ink); color: #4a4741; }

/* stage 3: message bubbles */
.bubbles { display: grid; margin: 0 auto; width: max-content; }
.bubbles i { display: block; margin: 12%; border-radius: 45% 45% 45% 12%; background: var(--bubble); }
.bubbles i:nth-child(2n) { border-radius: 45% 45% 12% 45%; }
.bubbles i.on { background: var(--ink); }

/* stage 4: suggestion chips */
#wall { position: absolute; left: 0; right: 0; z-index: 5; display: grid; place-content: center; background: var(--bg); animation: rise .5s ease-out; direction: ltr; }
@keyframes rise { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
.cw { display: grid; }
.cw b { font-weight: 400; margin: 8% 5%; border: 1px solid #d8d3c6; border-radius: 999px; display: grid; place-items: center; color: var(--muted); background: var(--card); overflow: hidden; white-space: nowrap; }
.cw b.on { background: var(--ink); border-color: var(--ink); color: #8d897d; }

/* stage 5: the composer */
#composer.takeover { position: absolute; z-index: 6; inset: 58px 24px 18px; width: auto; max-width: none; margin: 0; display: flex; flex-direction: column; animation: grow .45s ease-out; }
#composer.takeover #input { flex: 1; height: auto; font-family: var(--mono); line-height: 1.2; white-space: pre; overflow: hidden; color: var(--ink); direction: ltr; }
@keyframes grow { from { transform: scale(.4, .15); transform-origin: 50% 100%; opacity: .3; } }

/* stage 6: dark mode, every character and button is a pixel */
body.dense .msg.ai .body { line-height: 1.35; }
body.dense .px { padding: .08em 0; }
body.dense .px.on { background: var(--lit); color: var(--lit-text); }
body.dense main .pxbox.on { background: var(--lit) !important; color: var(--lit) !important; border-color: var(--lit) !important; }
body.dense :is(#sidebar, #topbar) .px { padding: 0; color: #4d4b46; }
body.dense :is(#sidebar, #topbar) .px.on { background: none; color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, .5); }
body.dense #sidebar .pxbox { opacity: .25; }
body.dense #sidebar .pxbox.on { opacity: 1; filter: brightness(1.6); }
#ghost { position: fixed; pointer-events: none; mix-blend-mode: screen; opacity: 0; z-index: 20; }

/* stage 7: the layout is gone; a field of UI parts, sized by brightness */
#soup { position: fixed; inset: 0; z-index: 15; display: grid; pointer-events: none; direction: ltr; }
#soup i { display: grid; place-items: center; transform: scale(0); will-change: transform; }
#soup i > * { width: 78%; height: 78%; }
#soup svg { fill: none; stroke: var(--lit); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#soup .w-spark { stroke: var(--accent); stroke-width: 2.6; animation: spin 2.4s linear infinite; }
#soup .w-avatar { border-radius: 50%; background: var(--lit); color: #262624; display: grid; place-items: center; font-size: 11px; font-weight: 600; overflow: hidden; }
#soup .w-send { border-radius: 24%; background: var(--accent); display: grid; place-items: center; }
#soup .w-send svg { width: 60%; height: 60%; stroke: #fff; }
#soup .w-chip { height: 46%; border: 1.5px solid var(--lit); border-radius: 999px; }
#soup .w-bubble { height: 62%; border-radius: 40% 40% 40% 10%; background: var(--lit); }
#soup .w-char { width: auto; height: auto; color: var(--lit); font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

body.playing #thread { overflow: hidden; }
#toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -8px); background: var(--ink); color: #f5f3ec; font-size: 13px; padding: 8px 15px; border-radius: 999px; opacity: 0; transition: opacity .3s, transform .3s; z-index: 30; pointer-events: none; white-space: nowrap; }
body.dark #toast { background: var(--lit); color: #1c1b19; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* the music: a YouTube player where the sidebar ends (top corner on phones) */
#yt.stowed { opacity: 0; pointer-events: none; }
#yt { position: fixed; z-index: 25; left: 10px; bottom: 66px; width: 240px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); box-shadow: 0 2px 10px rgba(40, 30, 10, .08); }
html[dir=rtl] #yt { left: auto; right: 10px; }
.yt-head { font-size: 11.5px; color: var(--muted); padding: 5px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
.yt-slot { height: 200px; background: #000; }
.yt-slot iframe { display: block; width: 100%; height: 100%; }
body.has-yt .me { margin-top: 246px; }

/* before the show: cover the page, point at the player, let people skip an ad */
#gate { position: fixed; inset: 0; z-index: 24; background: rgba(18, 17, 15, .84); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 24px; animation: fade .35s ease-out; }
@keyframes fade { from { opacity: 0; } }
.gate-card { max-width: 420px; text-align: center; color: #f2efe6; }
#gate-title { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 0 12px; }
#gate-body { font-size: 15.5px; line-height: 1.7; color: #d6d2c7; margin: 0 0 24px; }
#gate-arrow { position: fixed; width: 120px; height: 60px; transform-origin: 50% 50%; pointer-events: none; }
#gate-arrow svg { width: 100%; height: 100%; fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; animation: nudge .8s ease-in-out infinite alternate; }
@keyframes nudge { to { transform: translateX(-12px); } }
body.gated #yt { z-index: 26; box-shadow: 0 0 0 3px var(--accent), 0 8px 40px rgba(217, 119, 87, .35); }

/* the breakdown before the show */
body.unstable #thread .msg:last-of-type .body { text-shadow: 1px 0 rgba(255, 0, 60, .45), -1px 0 rgba(0, 190, 255, .45); }
.body.rgb { transform: translateX(3px) skewX(-4deg); text-shadow: 3px 0 rgba(255, 0, 60, .7), -3px 0 rgba(0, 190, 255, .7); }
.actions.stuck .spark { animation-duration: .22s; }
.msg.error .body { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #e6b8a9; background: #fbeee9; color: #97381f; border-radius: 10px; padding: 10px 14px; font: 14px/1.5 var(--sans); }
.err-ic { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #c2512f; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
#repair { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(45, 38, 25, .3); backdrop-filter: blur(2px); animation: fade .25s ease-out; }
.rp-card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 70px rgba(60, 50, 30, .22); padding: 24px; animation: pop .35s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes pop { 0% { transform: scale(.94) translateX(-6px); filter: drop-shadow(4px 0 rgba(255, 0, 60, .5)) drop-shadow(-4px 0 rgba(0, 190, 255, .5)); } 60% { transform: scale(1.01); filter: none; } }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
.rp-icon { width: 40px; height: 40px; border-radius: 50%; background: #f7e4da; color: #c2512f; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
#rp-title { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--soft); margin: 14px 0 8px; }
#rp-body { font-size: 15px; line-height: 1.6; color: var(--text); margin: 0 0 14px; }
.rp-warn { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; color: #85560f; background: #fdf3e2; border: 1px solid #f0dcad; border-radius: 10px; padding: 9px 12px; margin: 0; }
.rp-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.rp-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 18px; font-size: 14.5px; cursor: pointer; }
.rp-btn:hover { background: var(--hover); }
.rp-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.rp-btn:disabled { opacity: .7; cursor: default; }

/* language prompt, in the chat app's own style */
#langdlg { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(45, 38, 25, .26); backdrop-filter: blur(2px); animation: fade .3s ease-out; }
.ld-card { width: min(600px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 70px rgba(60, 50, 30, .2); padding: 26px 24px 22px; }
.ld-card .logo { width: 28px; height: 28px; }
#ld-title { font-family: var(--serif); font-weight: 400; font-size: 27px; line-height: 1.3; color: var(--soft); margin: 14px 0 20px; min-height: 2.6em; overflow-wrap: anywhere; }
#ld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 6px; }
.ld-opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 14.5px; cursor: pointer; text-align: start; white-space: nowrap; overflow: hidden; }
.ld-opt small { flex: none; color: var(--muted); font: 11px var(--mono); }
.ld-opt:hover, .ld-opt:focus-visible { background: var(--hover); outline: none; }
.ld-opt.suggested { border-color: var(--accent); }
.ld-opt.picked { background: var(--accent); border-color: var(--accent); color: #fff; }
.ld-opt.picked small { color: #fff; }

/* curtain call */
#end { position: fixed; inset: 0; z-index: 40; background: #111110; color: #f2efe6; display: grid; place-items: center; padding: 32px 18px; text-align: center; overflow: auto; }
.end-inner { max-width: 720px; }
.end-kicker { font: 12px var(--mono); letter-spacing: .22em; color: #8f8b80; margin: 0 0 18px; direction: ltr; }
#end-title { font-family: var(--sans); font-size: clamp(54px, 12vw, 132px); font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 0 0 22px; direction: ltr; }
#end-sub { font-family: var(--serif); font-size: clamp(16px, 2.2vw, 19px); line-height: 1.7; color: #d6d2c7; margin: 0 auto 30px; max-width: 34em; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 38px; }
.end-btn { border: 1px solid #4a4843; background: transparent; color: #f2efe6; border-radius: 999px; padding: 11px 22px; font-size: 15px; cursor: pointer; }
.end-btn:hover { border-color: #f2efe6; }
.end-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.end-btn.primary:hover { filter: brightness(1.08); }
.credits { list-style: none; padding: 0; margin: 0 0 16px; font-size: 13px; line-height: 1.9; color: #9a968a; }
.credits b { color: #d6d2c7; font-weight: 500; }
.end-parody { font-size: 11.5px; color: #6f6b61; margin: 0; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #thread { padding: 10px 16px 12px; }
  #composer { width: calc(100% - 32px); }
  #chips { padding: 0 16px; }
  .greeting { font-size: 26px; }
  #composer.takeover { inset: 56px 10px 12px; }
  #yt, html[dir=rtl] #yt { top: 54px; right: 8px; left: auto; bottom: auto; width: 180px; box-shadow: 0 4px 18px rgba(40, 30, 10, .18); }
  .yt-slot { height: 101px; }
  .ld-card { padding: 22px 16px 16px; }
  #ld-title { font-size: 23px; }
  #ld-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="langdlg" hidden>
  <div class="ld-card" role="dialog" aria-modal="true" aria-labelledby="ld-title">
    <svg class="logo" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h2 id="ld-title"></h2>
    <div id="ld-grid"></div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">

<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const main = $("#main"), thread = $("#thread"), chips = $("#chips"), input = $("#input"),
      composer = $("#composer"), sendBtn = $("#send"), statusEl = $("#status");
const SPARK = "M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4";
const LOGO = `<svg class="logo" viewBox="0 0 24 24"><path d="${SPARK}" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const ICONS = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  up: '<path d="M7 11v9H4v-9zM7 11l4-7c1.2 0 2.4 1 2 2.6L12.3 10H19a2 2 0 0 1 2 2.3l-1.3 6A2 2 0 0 1 17.7 20H7"/>',
  down: '<g transform="rotate(180 12 12)"><path d="M7 11v9H4v-9zM7 11l4-7c1.2 0 2.4 1 2 2.6L12.3 10H19a2 2 0 0 1 2 2.3l-1.3 6A2 2 0 0 1 17.7 20H7"/></g>',
  retry: '<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/>',
  send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
};

/* ------------------------------------------------------------------- i18n */
const I18N = window.I18N, EN = I18N.en;
let lang = "en", L = EN, segG = null, segW = null, histEls = [];
const t = (k, vars = {}) => String(L[k] ?? EN[k]).replace(/\{(\w+)\}/g, (_, n) => vars[n] ?? "");
const cjk = () => /^(zh|ja|ko)/.test(lang);
function graphemes(s) { return segG ? Array.from(segG.segment(s), x => x.segment) : Array.from(s); }
// Pixel units for the "everything" stage: words for scripts whose letters join up.
function pixelUnits(s) {
  const seg = /^(ar|hi)/.test(lang) && segW ? segW : segG;
  return seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);
}
function applyLang(code) {
  lang = I18N[code] ? code : "en";
  L = { ...EN, ...I18N[lang] };
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  if (typeof Intl.Segmenter === "function") {
    segG = new Intl.Segmenter(lang, { granularity: "grapheme" });
    segW = new Intl.Segmenter(lang, { granularity: "word" });
  }
  $("#l-new").textContent = L.newChat;
  $("#l-recent").textContent = L.recent;
  $("#l-guest").textContent = L.guest;
  $("#l-plan").textContent = L.plan;
  $("#l-avatar").textContent = graphemes(L.guest)[0];
  input.placeholder = L.placeholder;
  $("#disclaimer").textContent = L.disclaimer;
  $("#parody").textContent = L.parody;
  sendBtn.setAttribute("aria-label", L.send);
  $("#history").innerHTML = "";
  histEls = L.history.map(text => {
    const d = document.createElement("div");
    d.className = "hist"; d.textContent = text;
    $("#history").append(d);
    return d;
  });
}

/* ---------------------------------------------------------------- frames */
const BA = window.BAD_APPLE, W = BA.w, H = BA.h, FB = W * H / 8, TOTAL = BA.n / BA.fps;
let bits = null;
const ready = (async () => {
  const bin = Uint8Array.from(atob(BA.data), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  bits = new Uint8Array(await new Response(stream).arrayBuffer());
  for (let i = FB; i < bits.length; i++) bits[i] ^= bits[i - FB];   // undo the frame-to-frame XOR
})();
const ink = new Uint8Array(W * H);              // 1 = shadow (black in the PV)
const sat = new Int32Array((W + 1) * (H + 1));  // summed-area table of ink
let frameDiff = 0;                              // share of pixels that changed since the last frame
function loadFrame(f) {
  const o = f * FB;
  let changed = 0;
  for (let i = 0; i < W * H; i++) {
    const v = ((bits[o + (i >> 3)] >> (7 - (i & 7))) & 1) ^ 1;
    if (v !== ink[i]) changed++;
    ink[i] = v;
  }
  frameDiff = changed / (W * H);
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) {
      row += ink[y * W + x];
      sat[(y + 1) * (W + 1) + x + 1] = sat[y * (W + 1) + x + 1] + row;
    }
  }
}
function span(a, b, max) {
  a = Math.max(0, Math.min(max - 1, Math.round(a)));
  b = Math.max(a + 1, Math.min(max, Math.round(b)));
  return [a, b];
}
// Mean ink over a rectangle in frame coordinates (fractions allowed).
function inkIn(x0, y0, x1, y1) {
  [x0, x1] = span(x0, x1, W); [y0, y1] = span(y0, y1, H);
  const R = W + 1;
  return (sat[y1 * R + x1] - sat[y0 * R + x1] - sat[y1 * R + x0] + sat[y0 * R + x0]) / ((x1 - x0) * (y1 - y0));
}
function gridCells(cols, rows) {
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    cells.push([c * W / cols, r * H / rows, (c + 1) * W / cols, (r + 1) * H / rows]);
  return cells;
}
// Toggle .on for elements whose cell is mostly shadow (or mostly light, when lit).
function paint(els, cells, state, lit = false) {
  for (let i = 0; i < els.length; i++) {
    const c = cells[i];
    const v = c ? (inkIn(c[0], c[1], c[2], c[3]) > 0.5) !== lit : false;
    if (v !== state[i]) { state[i] = v; els[i].classList.toggle("on", v); }
  }
}
// Map the frame over the whole viewport like background-size: cover.
function coverMap() {
  const vw = innerWidth, vh = innerHeight, s = Math.max(vw / W, vh / H);
  return { s, ox: (vw - W * s) / 2, oy: (vh - H * s) / 2, vw, vh };
}
function monoCharWidth() {
  const s = document.createElement("span");
  s.style.cssText = "position:absolute;visibility:hidden;font:100px var(--mono);white-space:pre";
  s.textContent = "█".repeat(20);
  document.body.append(s);
  const w = s.getBoundingClientRect().width / 20 / 100;
  s.remove();
  return w;
}
function halfBlocks(chars) {  // 80x60 pixels -> 30 text rows, two pixels per character
  let out = "";
  for (let r = 0; r < H / 2; r++) {
    for (let c = 0; c < W; c++) out += chars[ink[2 * r * W + c] * 2 + ink[(2 * r + 1) * W + c]];
    if (r < H / 2 - 1) out += "\n";
  }
  return out;
}
function drawWhite(ctx, img) {   // white pixels of the current frame, transparent elsewhere
  for (let i = 0; i < W * H; i++) {
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = 255;
    img.data[i * 4 + 3] = ink[i] ? 0 : 255;
  }
  ctx.putImageData(img, 0, 0);
}

/* -------------------------------------------------------------- scramble */
const GLYPHS = Array.from("アカサタナハマヤラワンガザダバパ가나다라마바사아자차카타하БГДЖЗИЛФЦЧШЩЯΣΩΨΔλπξ░▒▓█▀▄■◆◇※§¶¤ابتجحدسشصطعقكلمنهي中文字語言選擇漢รกขคงจฉชอअआइकखगघचजझ");
// Decode el's text into target through random glyphs from many scripts.
function scramble(el, target, dur = 700) {
  const to = graphemes(target), n = Math.max(to.length, graphemes(el.textContent).length);
  const reveal = Array.from({ length: n }, (_, i) => (i / n) * dur * 0.6 + Math.random() * dur * 0.4);
  const start = performance.now();
  el.dir = /[֐-ࣿ]/.test(target) ? "rtl" : "ltr";
  if (el._scr) cancelAnimationFrame(el._scr.id), el._scr.done();
  return new Promise(done => {
    let last = 0;
    el._scr = { done };
    const step = now => {
      const e = now - start;
      if (e >= dur) { el.textContent = target; el._scr = null; return done(); }
      if (now - last > 45) {
        last = now;
        let out = "";
        for (let i = 0; i < n; i++)
          out += e >= reveal[i] ? (to[i] ?? "") : to[i] === " " ? " " : GLYPHS[Math.random() * GLYPHS.length | 0];
        el.textContent = out;
      }
      el._scr.id = requestAnimationFrame(step);
    };
    el._scr.id = requestAnimationFrame(step);
  });
}

/* --------------------------------------------------------------- chat UI */
let currentHist = null, fast = false, onSubmit = null;
function scrollDown() { thread.scrollTop = thread.scrollHeight; }
function setTitle(text) {
  $("#chat-title").textContent = text;
  if (currentHist) currentHist.textContent = text;
  document.title = text + " - Claude";
}
function leaveWelcome() {
  if (!main.classList.contains("welcome")) return;
  main.classList.remove("welcome");
  thread.innerHTML = "";
  currentHist = document.createElement("div");
  currentHist.className = "hist active";
  $("#history").prepend(currentHist);
}
function addMsg(role, cls = "") {
  const m = document.createElement("div");
  m.className = `msg ${role} ${cls}`;
  const b = document.createElement("div");
  b.className = "body";
  m.append(b);
  thread.append(m);
  return b;
}
function addUser(text) {
  leaveWelcome();
  addMsg("user").textContent = text;
  scrollDown();
}
function charDelay(ch) {
  if (fast) return 4;
  if ("。！？…!?.".includes(ch)) return 230;
  if ("，、：；,;:".includes(ch)) return 90;
  if (ch === "\n") return 110;
  return cjk() ? 24 + Math.random() * 26 : 11 + Math.random() * 14;
}
// Stream an assistant message. Parts: strings, {p: ms} pauses, {del: "text"} backspaces.
async function say(...parts) {
  const body = addMsg("ai");
  const row = document.createElement("div");
  row.className = "actions";
  row.innerHTML = LOGO.replace('class="logo"', 'class="spark"');
  body.after(row);
  scrollDown();
  await sleep(fast ? 80 : 550);
  const node = document.createTextNode("");
  body.append(node);
  for (const p of parts) {
    if (typeof p === "string") {
      for (const ch of p) { node.data += ch; scrollDown(); await sleep(charDelay(ch)); }
    } else if (p.p) {
      await sleep(fast ? p.p / 5 : p.p);
    } else if (p.del && node.data.endsWith(p.del)) {
      for (let k = 0; k < p.del.length; k++) { node.data = node.data.slice(0, -1); await sleep(fast ? 8 : 45); }
    }
  }
  row.innerHTML = ["copy", "up", "down", "retry"].map(k => `<button class="pxbox" type="button" tabindex="-1"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></button>`).join("");
  fast = false;
  scrollDown();
  return body;
}
// Offer choices as chips (typing a reply also works). Option: string or {label, pick}.
function choose(options, typed = 0) {
  return new Promise(resolve => {
    chips.innerHTML = "";
    const done = (i, text) => {
      chips.innerHTML = ""; onSubmit = null; input.value = ""; sendBtn.disabled = true;
      addUser(text);
      resolve(i);
    };
    options.forEach((o, i) => {
      const label = typeof o === "string" ? o : o.label;
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.style.animationDelay = i * 70 + "ms";
      b.onclick = () => { if (o.pick) o.pick(); done(i, label); };  // pick() runs inside the click
      chips.append(b);
    });
    onSubmit = text => done(typed, text);
    scrollDown();
  });
}
input.addEventListener("input", () => { sendBtn.disabled = !onSubmit || !input.value.trim(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); composer.requestSubmit(); }
});
composer.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (text && onSubmit) onSubmit(text);
});
thread.addEventListener("click", () => { fast = true; });

let toastTimer;
function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
async function glitch(el, text) {
  const g = "▀▄█▌▐░▒▓";
  el.classList.add("glitch");
  for (let k = 0; k < 9; k++) {
    el.textContent = Array.from(text, () => g[Math.random() * g.length | 0]).join("");
    await sleep(45);
  }
  el.textContent = text;
  el.classList.remove("glitch");
}

/* ---------------------------------------------------------------- stages */
const CW = monoCharWidth();
function threadBox() {
  return { w: Math.min(thread.clientWidth - 48, 980), h: thread.clientHeight - 40 };
}

// 1. A code block inside a reply. "Code blocks are safe; nothing gets out."
const codeStage = {
  enter() {
    const b = addMsg("ai", "stage");
    b.innerHTML = `<div class="code"><div class="code-head"><span>bad_apple.txt</span><span></span></div><pre></pre></div>`;
    b.querySelector(".code-head span:last-child").textContent = L.copy;
    this.pre = b.querySelector("pre");
    this.layout();
  },
  layout() {
    const { w, h } = threadBox();
    const fs = Math.min((w - 30) / (W * CW), (h - 60) / (H / 2 * 1.2), 15);
    const lh = Math.round(fs * 1.2);   // whole pixels, so rows of blocks meet without seams
    Object.assign(this.pre.style, { fontSize: fs + "px", lineHeight: lh + "px", height: lh * H / 2 + 24 + "px" });
    scrollDown();
  },
  frame() { this.pre.textContent = halfBlocks(" ▄▀█"); },
};

// 2. A wall of text; each character is a pixel.
const textStage = {
  cols: 48, rows: 36,
  enter() {
    const b = addMsg("ai", "stage");
    const wall = document.createElement("div");
    wall.className = "wall";
    const chars = graphemes(L.passage.replace(/\s+/g, " "));
    let k = 0;
    this.els = [];
    for (let r = 0; r < this.rows; r++) {
      const row = document.createElement("div");
      for (let c = 0; c < this.cols; c++) {
        const s = document.createElement("span");
        s.textContent = chars[k++ % chars.length];
        row.append(s); this.els.push(s);
      }
      wall.append(row);
    }
    b.append(wall);
    this.wall = wall;
    this.cells = gridCells(this.cols, this.rows);
    this.state = [];
    this.layout();
  },
  layout() {
    const { w, h } = threadBox();
    const cell = Math.floor(Math.min(w / this.cols, h / this.rows));
    this.wall.style.fontSize = cell * (cjk() ? 0.82 : 0.72) + "px";
    this.wall.style.lineHeight = cell + "px";
    for (const s of this.els) { s.style.width = s.style.height = cell + "px"; }
    scrollDown();
  },
  frame() { paint(this.els, this.cells, this.state); },
};

// 3. Rows of chat bubbles.
const bubbleStage = {
  cols: 32, rows: 24,
  enter() {
    const b = addMsg("ai", "stage");
    this.grid = document.createElement("div");
    this.grid.className = "bubbles";
    this.els = [];
    for (let i = 0; i < this.cols * this.rows; i++) {
      const e = document.createElement("i");
      this.grid.append(e); this.els.push(e);
    }
    b.append(this.grid);
    this.cells = gridCells(this.cols, this.rows);
    this.state = [];
    this.layout();
  },
  layout() {
    const { w, h } = threadBox();
    const cell = Math.floor(Math.min(w / this.cols, h / this.rows));
    this.grid.style.gridTemplateColumns = `repeat(${this.cols}, ${cell}px)`;
    this.grid.style.gridAutoRows = cell + "px";
    scrollDown();
  },
  frame() { paint(this.els, this.cells, this.state); },
};

// 4. The suggestion chips rise up and fill the screen.
const chipStage = {
  cols: 20, rows: 30,
  enter() {
    const wall = document.createElement("div");
    wall.id = "wall";
    this.grid = document.createElement("div");
    this.grid.className = "cw";
    this.els = [];
    const words = L.chipWords;
    for (let i = 0; i < this.cols * this.rows; i++) {
      const e = document.createElement("b");
      e.textContent = words[(i * 7 + (i / this.cols | 0)) % words.length];
      this.grid.append(e); this.els.push(e);
    }
    wall.append(this.grid);
    main.append(wall);
    this.wall = wall;
    this.cells = gridCells(this.cols, this.rows);
    this.state = [];
    this.layout();
  },
  layout() {
    const top = $("#topbar").offsetHeight, bottom = composer.offsetTop - 6;
    Object.assign(this.wall.style, { top: top + "px", height: bottom - top + "px" });
    const w = Math.min(main.clientWidth - 32, 980), h = bottom - top - 12;
    const cw = Math.floor(Math.min(w / this.cols, h / this.rows * 2)), ch = cw / 2;
    this.grid.style.gridTemplateColumns = `repeat(${this.cols}, ${cw}px)`;
    this.grid.style.gridAutoRows = ch + "px";
    this.grid.style.fontSize = Math.max(6, ch * (cjk() ? 0.42 : 0.36)) + "px";
  },
  frame() { paint(this.els, this.cells, this.state); },
  exit() { this.wall.remove(); },
};

// 5. The input box grows and "types" the video in ASCII.
const composerStage = {
  enter() {
    composer.classList.add("takeover");
    input.readOnly = true;
    this.layout();
  },
  layout() {
    const w = input.clientWidth, h = input.clientHeight;
    const fs = Math.min(w / (W * CW), h / (H / 2 * 1.2));
    input.style.fontSize = fs + "px";
    input.style.paddingLeft = Math.max(0, (w - W * CW * fs) / 2) + "px";
    input.style.paddingTop = Math.max(0, (h - H / 2 * 1.2 * fs) / 2) + "px";
  },
  frame() { input.value = halfBlocks(" .'#"); },
  exit() {
    composer.classList.remove("takeover");
    input.readOnly = false; input.value = "";
    input.removeAttribute("style");
  },
};

// 6. Lights out: dark mode, and every character and button is a pixel that lights up
//    where the PV is white. On scene cuts the layout gets knocked apart for a moment.
const ghost = $("#ghost"), gctx = ghost.getContext("2d"), gimg = gctx.createImageData(W, H);
function wrapChars(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.data.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      return !p || p.closest(".px, .pxbox, textarea, .stage, #status") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    for (const u of pixelUnits(n.data)) {
      if (u === "\n") { frag.append("\n"); continue; }
      const s = document.createElement("span");
      s.className = "px"; s.textContent = u;
      frag.append(s);
    }
    n.replaceWith(frag);
  }
}
const BLOCKS = ["#sidebar", "#topbar", "#thread", "#composer", "#disclaimer"];
function knock(power) {   // shove the big blocks around and slice them, then let them spring back
  for (const sel of BLOCKS) {
    if (Math.random() < 0.2) continue;
    const r = () => Math.random() * 2 - 1;
    const top = Math.random() * 45 | 0, bottom = Math.random() * 45 | 0;
    $(sel).animate([
      { transform: `translate(${r() * 70 * power}px, ${r() * 34 * power}px) rotate(${r() * 5 * power}deg) skewX(${r() * 8 * power}deg)`, clipPath: `inset(${top}% 0 ${bottom}% 0)` },
      { transform: "none", clipPath: "inset(0 0 0 0)" },
    ], { duration: 460, easing: "cubic-bezier(.2,.8,.2,1)" });
  }
}
const allStage = {
  enter() {
    document.body.classList.add("dark", "dense");

// A music source drives the clock. Until it is really playing, time stands still,
// so a slow-loading or buffering video never leaves the shadows behind.
const YT_IDS = [
  "FtutLA63Cp8",   // the PV as uploaded to NicoNico (03:39), same timing as frames.js
  "i41KoE0iMYU",   // Alstroemeria Records' own upload (03:53), only if the first can't be embedded
];
let music = null, offset = 0, startedAt = 0;

function silentMusic() {
  let t0 = 0;
  return {
    start(at) { t0 = performance.now() - at * 1000; },
    time() { return (performance.now() - t0) / 1000; },
    stop() {}, ended() { return false; }, waiting() { return false; },
  };
}
let ytApi = null;
function loadYouTubeApi() {
  return ytApi = ytApi || new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = () => resolve(window.YT);
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = reject;
    document.head.append(s);
    setTimeout(() => reject(new Error("timeout")), 12000);
  });
}
// Try each video until one can be embedded here; resolves to a source or null.
async function youtubeMusic() {
  let YT;
  try { YT = await loadYouTubeApi(); } catch { ytApi = null; return null; }
  const card = $("#yt"), slot = card.querySelector(".yt-slot");
  for (const id of YT_IDS) {
    slot.innerHTML = "<div></div>";
    card.classList.add("stowed");
    card.hidden = false;
    let failed = false;
    const player = await new Promise(resolve => {
      const vars = { playsinline: 1, rel: 0 };
      if (location.protocol.startsWith("http")) vars.origin = location.origin;
      const p = new YT.Player(slot.firstChild, {
        videoId: id, width: "100%", height: "100%", playerVars: vars,
        events: { onReady: () => resolve(p), onError: () => { failed = true; resolve(null); } },
      });
      setTimeout(() => resolve(null), 12000);
    });
    if (player) {   // embedding errors can arrive just after onReady
      for (let k = 0; k < 20 && !failed && !(player.getDuration() > 0); k++) await sleep(150);
      if (!failed) return ytSource(YT, player, card);
    }
  }
  card.hidden = true;
  return null;
}
function ytSource(YT, p, card) {
  const S = YT.PlayerState;
  let hold = 0, anchor = null, lastRaw = -1, fallback = null;
  p.addEventListener("onError", () => { fallback = silentMusic(); fallback.start(src.time()); });
  const src = {
    prime() {   // show the player and let it run muted, so a pre-roll ad can be skipped before the show
      card.classList.remove("stowed");
      document.body.classList.add("has-yt");
      p.mute(); p.playVideo();
    },
    start(at) {
      card.classList.remove("stowed");
      document.body.classList.add("has-yt");
      hold = at; anchor = null; fallback = null; p.unMute(); p.seekTo(at, true); p.playVideo();
    },
    time() {
      if (fallback) return fallback.time();
      const state = p.getPlayerState(), raw = p.getCurrentTime(), now = performance.now();
      if (state !== S.PLAYING) { anchor = null; if (state === S.PAUSED || state === S.ENDED) hold = raw; return hold; }
      // The player reports its time in coarse steps; run a local clock and ease it toward each report.
      if (!anchor) { anchor = { t: raw, at: now }; lastRaw = raw; }
      const est = anchor.t + (now - anchor.at) / 1000;
      if (raw !== lastRaw) {
        lastRaw = raw;
        const err = est - raw;
        if (Math.abs(err) > 0.3) anchor = { t: raw, at: now };
        else anchor.t -= err * 0.25;
      }
      return hold = anchor.t + (now - anchor.at) / 1000;
    },
    stop() { if (!fallback) p.pauseVideo(); },
    ended() { return !fallback && p.getPlayerState() === S.ENDED; },
    waiting() { return !fallback && p.getPlayerState() !== S.PLAYING; },
  };
  return src;
}
// Must run inside a click so browsers let the music start.
function startMusic(at) {
  if (!music) music = silentMusic();
  music.start(at);
  startedAt = performance.now();
}
// The "start" click: wake the player (or just start, if there is no player).
function goPick(at) {

// Cover the page and point at the player until the viewer says go.
function adGate(at) {
  if (startedAt || !music || !music.prime) return Promise.resolve();
  const gate = $("#gate"), arrow = $("#gate-arrow");
  $("#gate-title").textContent = L.adTitle;
  $("#gate-body").textContent = L.adBody;

    else if (r.left < innerWidth / 2) { x = r.right + 14; y = mid - 30; turn = 0; }                   // player on the left

    Object.assign(arrow.style, { left: x + "px", top: y + "px", transform: `rotate(${turn}deg)` });
  };

const mmss = s => `${String(s / 60 | 0).padStart(2, "0")}:${String(s % 60 | 0).padStart(2, "0")}`;

async function play(startAt = 0) {
  await ready;
  if (!startedAt) startMusic(startAt);
  stopReq = false;
  document.body.classList.add("playing");
  input.disabled = true;
  input.placeholder = L.placeholderPlaying;
  statusEl.hidden = false;
  const clock = () => music.time() + offset;

  let last = -1, cue = 0, stage = null, nagged = false, everPlayed = false;
  await new Promise(done => {
    function tick() {
      const f = Math.max(0, Math.floor(clock() * BA.fps));
      if (stopReq || f >= BA.n || music.ended()) return done();
      if (!music.waiting()) everPlayed = true;
      else if (!everPlayed) {
        const waited = performance.now() - startedAt;
        if (!nagged && waited > 4000) { nagged = true; toast(t("tapPlayer", { where: playerCorner() })); }
        if (waited > 12000) {   // the music never came; carry on without it
          const at = clock() - offset;
          music.stop();
          music = silentMusic();
          music.start(at);
          toast(L.musicLate);
        }
      }
      if (f !== last) {
        const next = STAGES.filter(s => s[0] <= f).pop()[1];
        loadFrame(f);
        if (next !== stage) { if (stage && stage.exit) stage.exit(); stage = stageNow = next; stage.enter(f); }
        while (cue < CUES.length && CUES[cue][0] <= f) CUES[cue++][1]();
        try { stage.frame(f); } catch (err) { console.error(err); }
        if (f >= 1686 && f % 3 === 0) drawFavicon(f >= 4262);
        if (f % 15 === 0) {
          statusEl.textContent = `▶ ${mmss(f / BA.fps)} / ${mmss(TOTAL)} · ${L.stopHint}`;
          document.title = `▶ Bad Apple!! ${mmss(f / BA.fps)} - Claude`;
        }
        last = f;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });

  if (stage && stage.exit) stage.exit();
  allStage.cleanup();
  soupStage.cleanup();
  stageNow = null;
  music.stop();
  startedAt = 0;
  ghost.style.opacity = 0;
  thread.querySelectorAll(".stage").forEach(e => e.remove());
  document.body.classList.remove("playing", "dark", "dense");
  statusEl.hidden = true;
  input.disabled = false;
  input.placeholder = L.placeholderReply;
  $("#model").textContent = "Claude";
  favLink.href = favOrig;
  setTitle("Bad Apple!!");
  scrollDown();
  histEls.forEach((e, i) => { e.textContent = L.history[i]; });
  return !stopReq;
}

// Claude starts to confess and breaks down: stutters, noise, backspaces, dead replies, an error.
const NOISE = "▀▄█▌▐░▒▓■□◆◇";
const noise = () => NOISE[Math.random() * NOISE.length | 0];
async function malfunction() {
  const body = addMsg("ai");
  const row = document.createElement("div");
  row.className = "actions";
  row.innerHTML = LOGO.replace('class="logo"', 'class="spark"');
  body.after(row);
  scrollDown();
  await sleep(550);
  const node = document.createTextNode("");
  body.append(node);
  const type = async (text, ms) => {
    for (const ch of graphemes(text)) { node.data += ch; scrollDown(); await sleep(ms ?? charDelay(ch)); }
  };
  const back = async n => {
    for (let k = 0; k < n; k++) { node.data = graphemes(node.data).slice(0, -1).join(""); await sleep(28); }
  };

  await type(L.confess[0]);
  await sleep(800);
  await type("\n\n");
  const g = graphemes(L.confess[1]), cut = Math.max(4, Math.floor(g.length * 0.42));
  await type(g.slice(0, cut).join(""));
  document.body.classList.add("unstable");
  row.classList.add("stuck");
  const tail = g.slice(cut - 3, cut).join("");
  for (let k = 0; k < 6; k++) await type(tail, 34 - k * 5);          // stutter
  knock(0.25);
  await sleep(250);
  await back(graphemes(tail).length * 4);
  for (let i = cut; i < g.length; i++) {                                // the rest rots as it comes out
    const p = (i - cut) / (g.length - cut);
    node.data += Math.random() < 0.15 + p * 0.75 ? noise() : g[i];
    if (Math.random() < 0.06) knock(0.15 + p * 0.3);
    scrollDown();
    await sleep(16 + Math.random() * 34);
  }
  for (let k = 0; k < 8; k++) { body.classList.toggle("rgb"); await sleep(60 + Math.random() * 60); }
  body.classList.remove("rgb");
  histEls.forEach((e, i) => setTimeout(() => glitch(e, e.textContent), i * 35));
  await sleep(500);

  const next = graphemes(L.confess[2]);
  for (const n of [5, 2, 1]) {                                           // replies that die at birth
    const b = addMsg("ai");
    b.textContent = next.slice(0, n).join("") + Array.from({ length: n + 2 }, noise).join("");
    scrollDown();
    knock(0.35);
    await sleep(420);
  }
  document.body.classList.remove("unstable");
  const err = addMsg("ai", "error");
  err.innerHTML = '<span class="err-ic">!</span><span></span>';
  err.lastChild.textContent = L.errMsg || "Claude ran into an error while responding.";
  scrollDown();
  await sleep(1100);
}

  setTitle(L.title0[c0]);
  if (c0 === 0) {
    const P = L.poem;
    await say(P.pre, { p: 500 }, P.apple, { p: 900 }, { del: P.del }, { p: 300 }, P.fix, { p: 700 }, "\n\n" + P.sorry);
  } else if (c0 === 1) {
    const K = L.snack, a = graphemes(K.apple);
    const half = a.slice(0, Math.max(1, a.length >> 1)).join("");
    await say(`${K.intro}\n\n1. ${K.item1}\n2. ${K.apple}\n3. ${K.apple}`, { p: 400 }, `\n4. ${half}`, { p: 800 },
      { del: `\n2. ${K.apple}\n3. ${K.apple}\n4. ${half}` }, { p: 300 }, `\n2. ${K.item2}\n3. ${K.item3}`, { p: 600 },
      "\n\n" + K.after);
  } else {
    await say(L.shadow[0], { p: 1000 }, "\n\n" + L.shadow[1], { p: 1100 }, "\n\n" + L.shadow[2]);
  }

  const c1 = await choose(L.c1);
  if (c1 === 0) await say(L.r1a);
  else await say(L.r1b[0], { p: 700 }, L.r1b[1]);
  await sleep(500);
  await glitch(histEls[3], "bad apple");
  await sleep(900);
  await say(L.sidebar);

  const c2 = await choose(L.c2);
  await say(L.r2[c2]);
  await sleep(400);
  glitch(histEls[1], "bad apple");
  await sleep(350);
  await glitch(histEls[6], "bad apple");
  await sleep(600);
  await glitch(currentHist, "Bad Apple!!");
  setTitle("Bad Apple!!");
  loadMusic();
  await malfunction();
  await Promise.race([loadMusic(), sleep(6000)]);
  await repairPrompt(0);
  await adGate(0);
  await run(0);
}

// #play or #t=142: skip the story (the repair click is still needed to start the music).
async function quickStart(at) {
  leaveWelcome();
  setTitle("Bad Apple!!");
  await Promise.race([loadMusic(), sleep(6000)]);
  await repairPrompt(at);
  await adGate(at);
  await run(at);
}

/* ------------------------------------------------------------------ start */
// Best guess at the viewer's language: last choice, else the browser's languages, else English.
function guessLanguage() {
  const codes = Object.keys(I18N);
  let saved = null;
  try { saved = localStorage.getItem("chat-lang"); } catch {}
  const match = l => codes.find(c => c.toLowerCase() === l.toLowerCase())
    || (/^zh-(tw|hk|mo)|hant/i.test(l) ? "zh-Hant" : /^zh/i.test(l) ? "zh-Hans" : codes.find(c => c === l.slice(0, 2)));
  return [saved, ...(navigator.languages || [navigator.language])].filter(Boolean).map(match).find(Boolean) || "en";
}

// A language prompt in the app's own style. Its heading decodes from one language's
// "choose your language" to the next through glyph noise.
function chooseLanguage(suggested) {
  const dlg = $("#langdlg"), title = $("#ld-title"), grid = $("#ld-grid");
  const codes = Object.keys(I18N), order = [suggested, ...codes.filter(c => c !== suggested)];
  dlg.hidden = false;
  const buttons = order.map((code, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ld-opt" + (code === suggested ? " suggested" : "");
    b.lang = b.dataset.code = code;
    b.innerHTML = "<span></span><small></small>";
    b.querySelector("small").textContent = code;
    grid.append(b);
    setTimeout(() => scramble(b.querySelector("span"), I18N[code].name, 500), 150 + i * 35);
    return b;
  });
  let hover = null, open = true;
  (async () => {
    for (let i = 0; open; i++) {
      const code = hover || order[i % order.length];
      title.lang = code;
      await scramble(title, I18N[code].choose, 650);
      for (let k = 0; k < 16 && open && !(hover && hover !== code); k++) await sleep(100);
      if (hover) i--;
    }
  })();
  for (const b of buttons) {
    b.onmouseenter = b.onfocus = () => { hover = b.dataset.code; };
    b.onmouseleave = b.onblur = () => { hover = null; };
  }
  setTimeout(() => buttons[0].focus({ preventScroll: true }), 300);
  return new Promise(resolve => {
    grid.addEventListener("click", async e => {
      const b = e.target.closest(".ld-opt");
      if (!b || !open) return;
      open = false;
      const code = b.dataset.code;
      b.classList.add("picked");
      title.lang = code;
      await scramble(title, I18N[code].choose, 350);
      await dlg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, easing: "ease-in" }).finished;
      dlg.hidden = true;
      try { localStorage.setItem("chat-lang", code); } catch {}
      resolve(code);
    });
  });
}
(async () => {
  if (!("DecompressionStream" in window)) {
    applyLang("en");
    thread.innerHTML = '<h1 class="greeting"></h1>';
    thread.firstChild.textContent = L.oldBrowser;
    return;
  }
  const forced = new URLSearchParams(location.search).get("lang");
  if (I18N[forced]) applyLang(forced);
  else {
    const guess = guessLanguage();
    applyLang(guess);
    renderGreeting();   // the page waits behind the prompt
    applyLang(await chooseLanguage(guess));
  }
  const m = location.hash.match(/^#(play|t=(\d+))/);
  if (m) quickStart(+(m[2] || 0));
  else story();
})();
